name: "Unsigned Build"

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or commit to build'
        required: false
        default: main

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned boringNotch
    runs-on: macos-15
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project boringNotch.xcodeproj

      - name: Select Xcode
        run: |
          for x in Xcode_16.4 Xcode_16.3 Xcode_16.2 Xcode_16.1 Xcode_16 Xcode; do if [ -d "/Applications/$x.app" ]; then sudo xcode-select -s "/Applications/$x.app" && break; fi; done
          xcodebuild -version

      - name: Build (unsigned)
        run: |
          xcodebuild build \
            -project boringNotch.xcodeproj \
            -scheme boringNotch \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO

      - name: Locate built app
        run: |
          APP=$(find DerivedData/Build/Products/Release -maxdepth 1 -name "*.app" | head -n 1)
          echo "APP=$APP" >> $GITHUB_ENV
          ls -la "$APP"

      - name: Create DMG
        run: |
          VENV_DIR="$RUNNER_TEMP/venv"
          python3 -m venv "$VENV_DIR"
          source "$VENV_DIR/bin/activate"
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install --require-hashes -r Configuration/dmg/requirements.txt
          chmod +x Configuration/dmg/create_dmg.sh
          ./Configuration/dmg/create_dmg.sh "$APP" "boringNotch.dmg" "Boring Notch"

      - name: Upload DMG
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boringNotch-unsigned-dmg
          path: boringNotch.dmg

      - name: Upload .app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boringNotch-unsigned-app
          path: ${{ env.APP }}
